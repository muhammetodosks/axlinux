# Masaüstü Politikası

version: 1
mode: permissive

labels:
  browsers:
    - firefox
    - chromium
    - google-chrome
  dev:
    - python
    - node
    - go

rules:
  - name: "tarayıcılar ssh anahtarlarını okuyamaz"
    subject: browsers
    object: ~/.ssh
    action: file.read
    effect: deny

  - name: "tarayıcılar /etc/shadow okuyamaz"
    subject: browsers
    object: /etc/shadow
    action: file.read
    effect: deny

  # NOT: net.* kurallari PORT ile calisir. Port verilmeden yazilan
  # bir ag kurali HICBIR baglantiyi etkilemez; AXlinux derleme
  # aninda hata verir. "Her yere cikabilir" anlami gelen bir
  # kural yazilacaksa o, desteklenen bir port degil - kurallar
  # port bazlidir. Istediginiz surec icin izin vermek yerine
  # gercekten kullanilan portlari listeleyin.
  - name: "geliştiriciler 443'e çıkabilir (https)"
    subject: dev
    action: net.connect
    port: 443
    effect: allow

  - name: "geliştiriciler paket sunucusuna (80) çıkabilir"
    subject: dev
    action: net.connect
    port: 80
    effect: allow

  - name: "hiçkimse /etc/shadow okuyamaz"
    subject: "*"
    object: /etc/shadow
    action: file.read
    effect: deny
