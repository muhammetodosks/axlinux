# /run/axlinux DIZINI BURAYA TASINDI.
#
# Once RuntimeDirectory=axlinux yalnizca axdaemon.service'te
# tanimliydi ve iki gercek hataya yol aciyordu:
#
#   1) BASLANGIC YARISI. systemd, sahibi olan servisin her
#      baslamasinda RuntimeDirectory dizinini SILIP YENIDEN
#      OLUSTURUR. Kanit (Debian 12):
#        20:07:51  axlog basladi, axlog.sock olusturdu
#        20:07:52  axdaemon basladi -> /run/axlinux silindi
#      axlog calismaya devam etti ama soketi diskte yoktu:
#        /proc/<pid>/fd  -> 3 socket  (bellekte)
#        ss -xl          -> 0        (diskte)
#      Yani "axlog aktif" gorunuyordu, audit kaydi ise HIC
#      BIR YERE GITMIYORDU. Kurulum "audit soketi yok" deyip
#      basarisiz oldu.
#
#   2) YENIDEN BASLATMA. axdaemon her restart oldugunda
#      baska servisin soketi silinirdi. Yani audit sessizce
#      kayit birakirdi ve "yeniden baslattiktan sonra olur"
#      notu kullaniciyi yaniltirdi.
#
# Cozum: paylasilan dizini HICBIR SERVIS sahiplenmez.
# systemd-tmpfiles-setup boot'ta ONCE calisir ve dizini bir kez
# kurar. Servis restart'lari icerigi silmez. Bu, birden fazla
# unit'in ayni dizini paylasmasi icin standart systemd
# desenidir.
d /run/axlinux 0755 root root -

# Guvenlik: boot sirasinda onceki oturumdan kalmis soketler
# dinlenmemis olabilir. Temizlenir, servisler yeniden baglar.
r /run/axlinux/axlog.sock
r /run/axlinux/axdaemon.sock
