# AXlinux sistem gunlugu (journald) ust siniri
#
# NEDEN BU DOSYA VAR
# ---------------
# journald varsayilani: kotu dosya sisteminin %10'u, en fazla 4G.
# 20 GB'lik bir Fedora Workstation kurulumunda bu 2 GB'dir ve
# KULLANICI TARAFINDAN HICBI KURULMAMIS olabilir. Sonuc:
# /var/log/journal sessizce buyuyor ve bir gunde diski dolduruyor.
#
# Bu, masaustunde AXlinux'i kullanan operator icin sessiz bir
# disk-dolma riskidir: AXlinux'in kendi audit logu sinirli
# (10 MB segment + 14 gun + 200 MB toplam), ama isletim sistemi
# gunlugu sinirsiz kalirsa o sinir anlamsizlasir.
#
# NEDEN AYRI DOSYA (drop-in) DEGIL ANA DOSYA
# ------------------------------------------
# /etc/systemd/journald.conf'yu DEGISTIRMIYORUZ. Boylece:
#   - yonetici ayarini geri alabilir (dosyayi silmek yeterli)
#   - baska bir paketin ayariyla cakismaz
#   - standart systemd oncelik sirasi kullanilir
# (drop-in > ana dosya)
#
# DEGERLER
# --------
# SystemMaxUse=200M   Arsiv + aktif toplam en fazla 200 MB
# SystemMaxFileSize=20M  Tek gunluk dosya en fazla 20 MB
# SystemKeepFree=1G    1 GB bos kalmasini garantiler; asilirsa
#                      journald YAZMAYI BIRAKIR (veri onceligi
#                      diskin bos kalmasidir)
# MaxRetentionSec=1month  Kanit bir ay tutulur
#
# Duzenlemek icin:  sudoedit /etc/systemd/journald.conf.d/10-axlinux.conf
# Kaldirmak icin:    sudo rm /etc/systemd/journald.conf.d/10-axlinux.conf
[Journal]
SystemMaxUse=200M
SystemMaxFileSize=20M
SystemKeepFree=1G
MaxRetentionSec=1month
