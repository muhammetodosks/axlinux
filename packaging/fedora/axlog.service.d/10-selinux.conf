# AXlinux SELinux uyumu icin systemd drop-in.
#
# NoNewPrivileges ILE SELINUX ALAN GECISI BIRBIRIYLE CALISMAZ.
#
# Linux cekirdegi, no_new_privats (nnp) acikken execve() ile
# SELinux ALAN GECISINI (type transition) REDDEDER. Bu bir
# yanlislik degil, bilincli bir kisitlamadir: nnp, ayricalik
# yukseltmeyi (privilege escalation) engeller.
#
# AXlinux kendi alaninda calisir (axlinux_daemon_t /
# axlinux_log_t). Bu alanlara gecis de bir type transition'dir.
# Sonuc Fedora 44'te servis HIC ACILAMADI:
#
#   axdaemon.service: Failed to execute /usr/local/bin/axdaemon:
#     Operation not permitted
#   axdaemon.service: Failed at step EXEC spawning
#     /usr/local/bin/axdaemon: Operation not permitted
#   Main process exited, code=exited, status=203/EXEC
#
# Iki secenek vardi:
#
#   a) NoNewPrivileges=yes kalir, AXlinux init_t'de calisir.
#      Bu durumda SELinux AXlinux'i KISITLAmaz. Sistem "calisiyor"
#      gorunur ama Fedora'nin sertlastirilmis profilinde
#      (unconfined modulu devre disi) AXlinux calismaz. SELinux
#      uyumlulugu SAHTE.
#
#   b) NoNewPrivileges=no, AXlinux kendi alaninda calisir.
#      SELinux gercekten kisitlar ve bu, nnp'den DAHA GUCLU bir
#      kisitlamadir (alan tabanli, ayricalik bazli degil).
#
# (b) secildi. Guvenlik kaybi telafi edilir:
#   - CapabilityBoundingSet yalniz CAP_BPF CAP_SYS_ADMIN CAP_PERFMON
#   - ProtectSystem=strict, ProtectHome=read-only
#   - PrivateTmp=yes, RestrictSUIDSGID=yes
#   - SELinux alani: yalniz kendi dosyalarini okur/yazar,
#     /bin/sh calistiramaz, aga yerel olarak baglanir
#
# SELinux KAPALI olan sistemlerde (Debian, Ubuntu, Pardus) bu
# drop-in KURULMAZ; temel birimde NoNewPrivileges=yes kalir.
[Service]
NoNewPrivileges=no
