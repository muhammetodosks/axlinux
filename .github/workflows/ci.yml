name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # --- Go ---
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Derle
        run: |
          cd src/go/axdaemon && go build ./...
          cd ../axlog   && go build ./...
      - name: Vet
        run: |
          cd src/go/axdaemon && go vet ./...
          cd ../axlog   && go vet ./...
      - name: Test
        run: cd src/go/axdaemon && go test ./...

  # --- Python ---
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bagimliliklar
        run: pip install pyyaml click rich
      - name: Sozdizimi
        run: python3 -m compileall -q src/python/axctl
      - name: Test
        run: |
          python3 tests/test_axctl.py
          python3 tests/test_paths.py

  # --- eBPF ---
  bpf:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Bagimliliklar
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev bpftool linux-tools-common

      - name: vmlinux.h uret
        run: |
          # BTF mevcutsa dogrudan al; yoksa Ubuntu paketinden kopyala.
          if sudo test -r /sys/kernel/btf/vmlinux; then
            sudo bpftool btf dump file /sys/kernel/btf/vmlinux format c \
              | sudo tee src/bpf/vmlinux.h > /dev/null
          else
            sudo apt-get install -y linux-headers-$(uname -r) || true
            VML=$(ls /usr/src/linux-headers-*/arch/x86/include/builtin/vmlinux.h 2>/dev/null | head -1)
            if [ -n "$VML" ]; then sudo cp "$VML" src/bpf/vmlinux.h; fi
          fi
          test -s src/bpf/vmlinux.h || {
            echo "::error::vmlinux.h uretilemedi"; exit 1; }

      - name: Derle ve dogrula
        working-directory: src/bpf
        run: make verify

      - name: Nesneyi yuklemeyi dene
        run: |
          # LSM bpf LSM'i bu runner'da aktif olmayabilir; bu bir
          # smoke testidir, basarisizlik derlemeyi gecersiz kilmaz.
          sudo mount -t bpf bpf /sys/fs/bpf 2>/dev/null || true
          sudo bpftool prog load src/bpf/axbpf.o /sys/fs/bpf/ax_ci type lsm \
            && echo "::notice::LSM yuklendi" \
            || echo "::notice::LSM yuklenemedi (beklenen: bpf LSM kapali)"

  # --- Butunluk ---
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      # Go<->C sabit sozlesmesi sessiz hatayi onler
      - name: Sabit sozlesmesi
        run: cd src/go/axdaemon && go test ./internal/maps/ ./internal/lsm/ ./internal/audit/ -v

  # --- Paketleme matrisi -------------------------------------------------
  #
  # NEDEN: "hangi surum destekleniyor" sorusunun OTOMATIK cevabi
  # olmali. Simdiye kadar CI yalnizca Go/Python/BPF/sozlesme
  # testleriyordu; hicbir paket gercekten derlenip kurulmuyordu.
  # Desteklenen surum listesi yalnizca elle bir VM'de dogrulanmis
  # bir seydi.
  #
  # Bu is, RPM ve .deb'yi gercekten DERLEyip imzalamayan bir is.
  # Icerik denetimi (deep_verify) sanal makinesiz calistirilamaz;
  # ozel olarak isaretlenmistir.
  packaging:
    name: paket (${{ matrix.image }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: fedora:41
            dist: rpm
          - image: fedora:42
            dist: rpm
          - image: fedora:43
            dist: rpm
          - image: fedora:44
            dist: rpm
          - image: debian:12
            dist: deb
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Kurulum araclari
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.dist }}" = "rpm" ]; then
            dnf install -y golang clang llvm bpftool make gcc \
              rpm-build rpm-sign python3-devel python3-setuptools \
              python3-click python3-rich python3-yaml \
              selinux-policy-devel systemd-rpm-macros \
              'kernel-devel-$(uname -r)' kernel-core
          else
            # Go surumu: Debian 12'de apt'in "golang" paketi Go 1.19
            # verir, ancak proje Go 1.21 istiyor (go.mod "go 1.21"
            # ve kod log/slog kullanir). Bu, deb isini sessizce
            # kirardi: "make go" -> "log/slog is not in GOROOT".
            #
            # Cozum: bookworm-backports'tan Go 1.23 kurulur ve
            # PATH'e islenir. Surum asagida AYRI bir adimda denetlenir.
            echo "deb http://deb.debian.org/debian bookworm-backports main" \
              > /etc/apt/sources.list.d/backports.list
            apt-get update
            apt-get install -y --no-install-recommends \
              golang-1.23-go clang llvm \
              make dpkg-dev python3-dev python3-setuptools \
              python3-click python3-rich python3-yaml \
              linux-headers-amd64
            echo "/usr/lib/go-1.23/bin" >> "$GITHUB_PATH"
          fi

      - name: Go surum denetimi
        shell: bash
        run: |
          set -euo pipefail
          go version
          # go.mod "go 1.21" istiyor. daha eski bir Go sessizce
          # derlemez; acik hata verir.
          ver="$(go env GOVERSION | sed 's/^go//' | cut -d. -f1,2)"
          if [ "$(printf '%s\n%s\n' 1.21 "$ver" | sort -V | head -1)" != "1.21" ]; then
            echo "::error::Go 1.21+ gerekli, bulunan $ver"; exit 1
          fi
          echo "Go $ver >= 1.21 OK"

      - name: BPF nesnesini turet
        shell: bash
        run: |
          set -euo pipefail
          make bpf 2>&1 | tail -20

      - name: Go ve Python
        shell: bash
        run: |
          set -euo pipefail
          make go
          # python hedefi calisma zamani bagimliliklarini kontrol eder;
          # hepsi kurulu oldugu icin burada da gecmeli.
          make python

      - name: RPM derle
        if: matrix.dist == 'rpm'
        shell: bash
        run: |
          set -euo pipefail
          # SKIP_SIGN: CI imzalamaz (anahtar yok), yalnizca derleme
          # ve icerik dogrulanir. Imza gercek anahtarli ortamda
          # (Fedora 44 VM) test edilir.
          make rpm SKIP_SIGN=1 2>&1 | tail -30
          ls -la ../axlinux-*.rpm

      - name: .deb derle
        if: matrix.dist == 'deb'
        shell: bash
        run: |
          set -euo pipefail
          make package 2>&1 | tail -20
          ls -la ../axlinux_*.deb

      - name: Icerik dogrulamasi
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.dist }}" = "rpm" ]; then
            RPM=$(ls -1 ../axlinux-*.rpm | head -1)
            echo "--- RPM icerigi ---"
            rpm -qlp "$RPM" | grep -E 'axbpf\.o|/axdaemon|/axlog|journald' || {
              echo "::error::RPM icerigi eksik"; exit 1; }
            echo "--- SELinux modulu ---"
            rpm -qlp "$RPM" | grep -q 'selinux/packages/axlinux.pp' || {
              echo "::error::SELinux modulu RPM icinde degil"; exit 1; }
            rpm -qp --requires "$RPM" | grep -q 'kernel-core' || {
              echo "::error::kernel-core bagimliligi yok"; exit 1; }
          else
            DEB=$(ls -1 ../axlinux_*.deb | head -1)
            echo "--- .deb icerigi ---"
            dpkg-deb -c "$DEB" | grep -E 'axbpf\.o|/axdaemon|/axlog' >/dev/null || {
              echo "::error::.deb icerigi eksik"; exit 1; }
            dpkg-deb -c "$DEB" | grep -q 'journald.conf.d/10-axlinux.conf' || {
              echo "::error::journald drop-in .deb icinde degil"; exit 1; }
            dpkg-deb --ctrl-tarfile "$DEB" | tar -xO ./conffiles | \
              grep -q 'journald.conf.d/10-axlinux.conf' || {
              echo "::error::journald conffiles kaydi yok"; exit 1; }
          fi
          echo "paketleme matrisi: ${{ matrix.image }} TAMAM"

      - name: Icerik dogrulamasi (VM gerekir)
        shell: bash
        run: |
          echo "::warning::deep_verify.sh sanal makinesiz calistirilamaz"
          echo "::warning::icerik dogrulamasi ayrica Fedora 44 VM'de yapilir"
